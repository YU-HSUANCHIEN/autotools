<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片、影片批量轉檔小工具</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

    <style>
        :root {
            --bg-dark: #070a12;
            --panel-bg: rgba(15, 23, 42, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(30, 41, 59, 0.5);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
        }
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--panel-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .logo-container { display: flex; align-items: center; gap: 0.75rem; }
        .logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px var(--accent-glow); color: white; font-size: 0.9rem;
        }
        .logo-title { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .badge {
            font-size: 0.65rem; padding: 2px 8px; border-radius: 20px;
            background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); font-weight: 600;
        }
        .status-badge {
            display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem;
            padding: 0.35rem 0.85rem; border-radius: 30px; background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2);
        }
        .status-badge.ready { background: rgba(16, 185, 129, 0.1); color: #34d399; border-color: rgba(16, 185, 129, 0.2); }
        .status-badge.error { background: rgba(239, 68, 68, 0.1); color: #f87171; border-color: rgba(239, 68, 68, 0.2); }
        main {
            flex: 1; max-width: 900px; width: 100%; margin: 0 auto; padding: 1.5rem 1rem 3rem 1rem;
            display: flex; flex-direction: column; gap: 1.25rem;
        }
        .glass-panel {
            background: var(--panel-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border); border-radius: var(--border-radius); padding: 1.25rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .tabs-wrapper {
            display: flex; background: rgba(10, 15, 28, 0.7); padding: 4px; border-radius: 14px; border: 1px solid var(--panel-border); gap: 4px;
        }
        .tab-btn {
            flex: 1; padding: 0.65rem 1rem; border: none; background: transparent; color: var(--text-muted);
            font-size: 0.85rem; font-weight: 600; border-radius: 10px; cursor: pointer; transition: all 0.25s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .tab-btn.active { background: var(--accent); color: white; box-shadow: 0 4px 15px var(--accent-glow); }
        .control-group { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; }
        .input-label-group { display: flex; align-items: center; gap: 0.75rem; flex: 1; min-width: 200px; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
        select, input[type="range"] {
            background: rgba(15, 23, 42, 0.8); border: 1px solid var(--panel-border); color: var(--text-main);
            padding: 0.55rem 0.85rem; border-radius: 10px; font-size: 0.85rem; outline: none; width: 100%;
        }
        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 2.5rem 1.5rem; text-align: center;
            cursor: pointer; transition: all 0.3s ease; background: rgba(15, 23, 42, 0.3);
        }
        .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(99, 102, 241, 0.05); }
        .drop-icon {
            width: 54px; height: 54px; border-radius: 16px; background: rgba(99, 102, 241, 0.1); color: #818cf8;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem auto;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .drop-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.35rem; }
        .drop-sub { font-size: 0.75rem; color: var(--text-muted); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover)); color: white; border: none;
            padding: 0.75rem 1.5rem; border-radius: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; gap: 0.5rem; box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            background: rgba(30, 41, 59, 0.6); color: var(--text-muted); border: 1px solid var(--panel-border);
            padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
        }
        .queue-container { display: flex; flex-direction: column; gap: 0.75rem; }
        .queue-header { display: flex; align-items: center; justify-content: space-between; padding: 0 0.25rem; }
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.75rem; max-height: 320px; overflow-y: auto; }
        .file-card {
            background: var(--card-bg); border: 1px solid var(--panel-border); padding: 0.75rem 1rem;
            border-radius: 12px; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
        }
        .file-info { display: flex; align-items: center; gap: 0.75rem; overflow: hidden; }
        .file-icon {
            width: 34px; height: 34px; border-radius: 8px; background: rgba(15, 23, 42, 0.6);
            display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: #818cf8; flex-shrink: 0;
        }
        .file-details { overflow: hidden; }
        .file-name { font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-meta { font-size: 0.7rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.5rem; margin-top: 2px; }
        .progress-box {
            background: rgba(10, 15, 28, 0.6); border: 1px solid var(--panel-border); border-radius: 14px; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem;
        }
        .progress-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }
        .progress-bar-bg { width: 100%; height: 8px; background: rgba(30, 41, 59, 0.8); border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #a855f7); border-radius: 10px; transition: width 0.2s ease; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <div class="logo-title">圖片、影片批量轉檔工具<span class="badge"> v3.1 最佳化版</span></div>
        </div>
        <div id="ffmpeg-status" class="status-badge">
            <i class="fa-solid fa-circle-info"></i>
            <span>點擊轉檔時按需載入引擎</span>
        </div>
    </header>

    <main>
        <div class="tabs-wrapper">
            <button onclick="switchTab('image')" id="tab-btn-image" class="tab-btn active">
                <i class="fa-regular fa-image"></i><span>圖片批量轉檔</span>
            </button>
            <button onclick="switchTab('video')" id="tab-btn-video" class="tab-btn">
                <i class="fa-solid fa-clapperboard"></i><span>影音批量轉檔</span>
            </button>
        </div>

        <!-- 圖片轉檔面板 -->
        <div id="tab-image" class="glass-panel" style="display: flex; flex-direction: column; gap: 1.25rem;">
            <div class="control-group">
                <div class="input-label-group">
                    <label for="image-format-select">目標格式：</label>
                    <select id="image-format-select">
                        <option value="image/jpeg">JPG / JPEG</option>
                        <option value="image/png" selected>PNG</option>
                        <option value="image/webp">WebP</option>
                        <option value="image/avif">AVIF</option>
                        <option value="image/bmp">BMP</option>
                        <option value="image/gif">GIF</option>
                    </select>
                </div>
                <div class="input-label-group" style="max-width: 220px;">
                    <label for="image-quality">品質：<span id="quality-val" style="color: #818cf8;">90%</span></label>
                    <input type="range" id="image-quality" min="0.1" max="1" step="0.05" value="0.9">
                </div>
            </div>

            <div id="image-dropzone" class="drop-zone" onclick="document.getElementById('image-file-input').click()">
                <input type="file" id="image-file-input" multiple accept="image/*,.heic,.heif" class="hidden">
                <div class="drop-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                <div class="drop-title">點擊選擇圖片，或將檔案拖曳至此</div>
                <div class="drop-sub">支援 JPG, PNG, WebP, GIF, BMP, AVIF 及 HEIC / HEIF 格式</div>
            </div>

            <div id="image-queue-container" class="queue-container hidden">
                <div class="queue-header">
                    <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">
                        待處理圖片列表 (<span id="image-count-badge" style="color: #818cf8;">0</span>)
                    </span>
                    <div style="display: flex; gap: 0.5rem;">
                        <button onclick="clearImageQueue()" class="btn-secondary">清空全部</button>
                        <button onclick="startImageConversion()" id="image-convert-btn" class="btn-primary">
                            <i class="fa-solid fa-bolt"></i> 開始批量轉檔
                        </button>
                    </div>
                </div>

                <div id="image-progress-wrapper" class="progress-box hidden">
                    <div class="progress-info">
                        <span id="image-progress-text">準備轉檔...</span>
                        <span id="image-progress-percent" style="font-family: monospace;">0%</span>
                    </div>
                    <div class="progress-bar-bg"><div id="image-progress-bar" class="progress-bar-fill"></div></div>
                </div>

                <div id="image-list" class="file-grid"></div>
            </div>
        </div>

        <!-- 影音轉檔面板 -->
        <div id="tab-video" class="glass-panel hidden" style="display: flex; flex-direction: column; gap: 1.25rem;">
            <div class="control-group">
                <div class="input-label-group">
                    <label for="video-format-select">目標格式：</label>
                    <select id="video-format-select">
                        <option value="mp4" selected>MP4 (.mp4)</option>
                        <option value="webm">WebM (.webm)</option>
                        <option value="mkv">MKV (.mkv)</option>
                        <option value="avi">AVI (.avi)</option>
                        <option value="mov">MOV (.mov)</option>
                        <option value="gif">動態 GIF (.gif)</option>
                        <option value="mp3">提取音訊 MP3 (.mp3)</option>
                    </select>
                </div>
            </div>

            <div id="video-dropzone" class="drop-zone" onclick="document.getElementById('video-file-input').click()">
                <input type="file" id="video-file-input" multiple accept="video/*,audio/*" class="hidden">
                <div class="drop-icon"><i class="fa-solid fa-file-video"></i></div>
                <div class="drop-title">點擊選擇影音檔，或將檔案拖曳至此</div>
                <div class="drop-sub">支援 MP4, MKV, MOV, AVI, WebM, MP3 等格式</div>
            </div>

            <div id="video-queue-container" class="queue-container hidden">
                <div class="queue-header">
                    <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">
                        待處理影音列表 (<span id="video-count-badge" style="color: #818cf8;">0</span>)
                    </span>
                    <div style="display: flex; gap: 0.5rem;">
                        <button onclick="clearVideoQueue()" class="btn-secondary">清空全部</button>
                        <button onclick="startVideoConversion()" id="video-convert-btn" class="btn-primary">
                            <i class="fa-solid fa-bolt"></i> 開始批量轉檔
                        </button>
                    </div>
                </div>

                <div id="video-progress-wrapper" class="progress-box hidden">
                    <div class="progress-info">
                        <span id="video-progress-text">準備轉檔...</span>
                        <span id="video-time-remaining" style="color: #818cf8;">等待中...</span>
                    </div>
                    <div class="progress-bar-bg"><div id="video-progress-bar" class="progress-bar-fill"></div></div>
                </div>

                <div id="video-list" class="file-grid"></div>
            </div>
        </div>
    </main>

    <script>
        let imageFiles = [];
        let videoFiles = [];
        let ffmpeg = null;

        document.getElementById('image-quality').addEventListener('input', (e) => {
            document.getElementById('quality-val').textContent = Math.round(e.target.value * 100) + '%';
        });

        function switchTab(tab) {
            const imgTab = document.getElementById('tab-image');
            const vidTab = document.getElementById('tab-video');
            const imgBtn = document.getElementById('tab-btn-image');
            const vidBtn = document.getElementById('tab-btn-video');

            if (tab === 'image') {
                imgTab.classList.remove('hidden');
                vidTab.classList.add('hidden');
                imgBtn.classList.add('active');
                vidBtn.classList.remove('active');
            } else {
                vidTab.classList.remove('hidden');
                imgTab.classList.add('hidden');
                vidBtn.classList.add('active');
                imgBtn.classList.remove('active');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setupZone('image-dropzone', 'image-file-input', (files) => {
                for (let f of files) imageFiles.push({ file: f, name: f.name, size: f.size, status: 'pending' });
                renderImageQueue();
            });
            setupZone('video-dropzone', 'video-file-input', (files) => {
                for (let f of files) videoFiles.push({ file: f, name: f.name, size: f.size, status: 'pending' });
                renderVideoQueue();
            });
        });

        function setupZone(zoneId, inputId, handler) {
            const zone = document.getElementById(zoneId);
            const input = document.getElementById(inputId);
            ['dragenter', 'dragover'].forEach(n => zone.addEventListener(n, e => { e.preventDefault(); zone.classList.add('dragover'); }));
            ['dragleave', 'drop'].forEach(n => zone.addEventListener(n, e => { e.preventDefault(); zone.classList.remove('dragover'); }));
            zone.addEventListener('drop', e => { if (e.dataTransfer.files?.length) handler(e.dataTransfer.files); });
            input.addEventListener('change', e => { if (e.target.files?.length) handler(e.target.files); });
        }

        function renderImageQueue() {
            const container = document.getElementById('image-queue-container');
            const listEl = document.getElementById('image-list');
            document.getElementById('image-count-badge').textContent = imageFiles.length;
            if (!imageFiles.length) { container.classList.add('hidden'); return; }
            container.classList.remove('hidden');
            listEl.innerHTML = imageFiles.map((item, idx) => `
                <div class="file-card">
                    <div class="file-info">
                        <div class="file-icon"><i class="fa-regular fa-image"></i></div>
                        <div class="file-details">
                            <div class="file-name">${item.name}</div>
                            <div class="file-meta"><span>${(item.size/1024/1024).toFixed(1)} MB</span></div>
                        </div>
                    </div>
                    <button onclick="imageFiles.splice(${idx},1);renderImageQueue();" class="btn-secondary" style="padding:0.35rem 0.6rem;"><i class="fa-solid fa-xmark"></i></button>
                </div>
            `).join('');
        }

        function clearImageQueue() { imageFiles = []; document.getElementById('image-file-input').value = ''; renderImageQueue(); }

        async function startImageConversion() {
            if (!imageFiles.length) return;
            const targetFormat = document.getElementById('image-format-select').value;
            const quality = parseFloat(document.getElementById('image-quality').value);
            const wrapper = document.getElementById('image-progress-wrapper');
            const bar = document.getElementById('image-progress-bar');
            wrapper.classList.remove('hidden');

            for (let i = 0; i < imageFiles.length; i++) {
                let item = imageFiles[i];
                bar.style.width = Math.round(((i+1)/imageFiles.length)*100) + '%';
                try {
                    let blob = item.file;
                    if (item.name.toLowerCase().endsWith('.heic')) {
                        const conv = await heic2any({ blob: item.file, toType: 'image/jpeg', quality });
                        blob = Array.isArray(conv) ? conv[0] : conv;
                    }
                    const resBlob = await new Promise((res, rej) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width; canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            if (targetFormat === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
                            ctx.drawImage(img, 0, 0);
                            canvas.toBlob(b => b ? res(b) : rej(), targetFormat, quality);
                        };
                        img.onerror = rej;
                        img.src = URL.createObjectURL(blob);
                    });
                    const ext = targetFormat.split('/')[1];
                    downloadBlob(resBlob, `${item.name.substring(0, item.name.lastIndexOf('.'))}_converted.${ext}`);
                } catch(e) { console.error(e); }
            }
            setTimeout(() => { clearImageQueue(); wrapper.classList.add('hidden'); }, 1500);
        }

        function renderVideoQueue() {
            const container = document.getElementById('video-queue-container');
            const listEl = document.getElementById('video-list');
            document.getElementById('video-count-badge').textContent = videoFiles.length;
            if (!videoFiles.length) { container.classList.add('hidden'); return; }
            container.classList.remove('hidden');
            listEl.innerHTML = videoFiles.map((item, idx) => `
                <div class="file-card">
                    <div class="file-info">
                        <div class="file-icon"><i class="fa-solid fa-clapperboard"></i></div>
                        <div class="file-details">
                            <div class="file-name">${item.name}</div>
                            <div class="file-meta"><span>${(item.size/1024/1024).toFixed(1)} MB</span></div>
                        </div>
                    </div>
                    <button onclick="videoFiles.splice(${idx},1);renderVideoQueue();" class="btn-secondary" style="padding:0.35rem 0.6rem;"><i class="fa-solid fa-xmark"></i></button>
                </div>
            `).join('');
        }

        function clearVideoQueue() { videoFiles = []; document.getElementById('video-file-input').value = ''; renderVideoQueue(); }

        // 按需載入核心，解決網頁卡死問題
        async function startVideoConversion() {
            if (!videoFiles.length) return;
            const targetExt = document.getElementById('video-format-select').value;
            const wrapper = document.getElementById('video-progress-wrapper');
            const bar = document.getElementById('video-progress-bar');
            const statusText = document.getElementById('video-progress-text');
            const statusBadge = document.getElementById('ffmpeg-status');
            wrapper.classList.remove('hidden');

            try {
                if (!ffmpeg) {
                    statusText.textContent = '正在按需載入轉檔引擎...';
                    statusBadge.className = "status-badge";
                    statusBadge.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>載入中...</span>';
                    
                    const { createFFmpeg } = FFmpeg;
                    ffmpeg = createFFmpeg({ log: true });
                    await ffmpeg.load();

                    statusBadge.className = "status-badge ready";
                    statusBadge.innerHTML = '<i class="fa-solid fa-circle-check"></i><span>引擎就緒</span>';
                }

                for (let i = 0; i < videoFiles.length; i++) {
                    let item = videoFiles[i];
                    statusText.textContent = `轉檔中 (${i+1}/${videoFiles.length}): ${item.name}`;
                    
                    const inputName = `in_${i}`;
                    const outputName = `out_${i}.${targetExt}`;

                    ffmpeg.FS('writeFile', inputName, await FFmpeg.fetchFile(item.file));
                    
                    ffmpeg.setProgress(({ ratio }) => {
                        bar.style.width = Math.round(ratio * 100) + '%';
                    });

                    if (targetExt === 'gif') {
                        await ffmpeg.run('-i', inputName, '-vf', 'fps=10,scale=320:-1', outputName);
                    } else if (targetExt === 'mp3') {
                        await ffmpeg.run('-i', inputName, outputName);
                    } else {
                        await ffmpeg.run('-i', inputName, '-vcodec', 'libx264', '-crf', '28', '-preset', 'ultrafast', outputName);
                    }

                    const data = ffmpeg.FS('readFile', outputName);
                    downloadBlob(new Blob([data.buffer]), `${item.name.substring(0, item.name.lastIndexOf('.'))}_converted.${targetExt}`);

                    ffmpeg.FS('unlink', inputName);
                    ffmpeg.FS('unlink', outputName);
                }

                statusText.textContent = '所有影音轉檔完成！';
                setTimeout(() => { clearVideoQueue(); wrapper.classList.add('hidden'); }, 1500);
            } catch (err) {
                console.error(err);
                statusText.textContent = '轉檔發生錯誤';
                statusBadge.className = "status-badge error";
                statusBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i><span>載入失敗</span>';
            }
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }
    </script>
</body>
</html>
