<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片、影片批量轉檔工具</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HEIC 支援庫 -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <!-- FFmpeg v0.11.6 核心套件 -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
        }
        .glass-card {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
        }
        custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-xl glass-card rounded-2xl p-6 md:p-8">
        <!-- 標題 -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
                <span>⚡</span> 萬能多媒體轉檔引擎
            </h1>
            <p class="text-xs text-slate-400 mt-1">完全在瀏覽器端運作・隱私安全・支援批量・極速轉檔</p>
        </div>

        <!-- 標籤導覽列 -->
        <div class="flex bg-slate-900/80 p-1.5 rounded-xl mb-6 border border-white/5">
            <button id="tabImgBtn" onclick="switchTab('image')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-indigo-400 bg-indigo-500/15 shadow-sm">
                📷 圖片轉檔 (含 HEIC)
            </button>
            <button id="tabVidBtn" onclick="switchTab('video')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-400 hover:text-white">
                🎬 影片 / 音訊轉檔
            </button>
        </div>

        <!-- 圖片轉檔面板 -->
        <div id="imageCard" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">選擇或拖曳圖片檔案 (可多選)</label>
                <div id="imageDropZone" class="drop-zone rounded-xl p-6 text-center cursor-pointer bg-slate-900/40" onclick="document.getElementById('imageInput').click()">
                    <div class="text-3xl mb-2">📁</div>
                    <p class="text-sm font-medium text-slate-300">點擊此處或拖曳圖片到這裡</p>
                    <p class="text-xs text-slate-500 mt-1">支援 JPG, PNG, WebP, AVIF, BMP, GIF, HEIC</p>
                    <input type="file" id="imageInput" accept="image/*,.heic,.heif" multiple class="hidden">
                </div>
                <div id="imageList" class="hidden mt-2 p-3 bg-slate-900/60 rounded-xl text-xs text-slate-300 max-h-28 overflow-y-auto space-y-1"></div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">目標圖片格式</label>
                <select id="imageTargetFormat" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
                    <option value="image/jpeg">JPG / JPEG (.jpg)</option>
                    <option value="image/png">PNG (.png)</option>
                    <option value="image/webp">WebP (.webp)</option>
                    <option value="image/avif">AVIF (.avif)</option>
                    <option value="image/bmp">BMP (.bmp)</option>
                    <option value="image/gif">GIF (.gif)</option>
                </select>
            </div>

            <button onclick="convertImages()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/25 transition-all text-sm">
                開始批量轉換圖片
            </button>
        </div>

        <!-- 影片轉檔面板 -->
        <div id="videoCard" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">選擇或拖曳影片 / 音訊檔案 (可多選)</label>
                <div id="videoDropZone" class="drop-zone rounded-xl p-6 text-center cursor-pointer bg-slate-900/40" onclick="document.getElementById('videoInput').click()">
                    <div class="text-3xl mb-2">🎬</div>
                    <p class="text-sm font-medium text-slate-300">點擊此處或拖曳影片到這裡</p>
                    <p class="text-xs text-slate-500 mt-1">支援 MP4, MKV, AVI, MOV, WebM, FLV 等</p>
                    <input type="file" id="videoInput" accept="video/*,audio/*" multiple class="hidden">
                </div>
                <div id="videoList" class="hidden mt-2 p-3 bg-slate-900/60 rounded-xl text-xs text-slate-300 max-h-28 overflow-y-auto space-y-1"></div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">目標影片 / 音訊格式</label>
                <select id="videoTargetExt" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
                    <optgroup label="主流影片格式">
                        <option value="mp4">MP4 (.mp4)</option>
                        <option value="webm">WebM (.webm)</option>
                        <option value="mkv">MKV (.mkv)</option>
                        <option value="avi">AVI (.avi)</option>
                        <option value="mov">MOV (.mov)</option>
                        <option value="flv">FLV (.flv)</option>
                        <option value="wmv">WMV (.wmv)</option>
                    </optgroup>
                    <optgroup label="特殊與音訊格式">
                        <option value="gif">動態 GIF (.gif)</option>
                        <option value="mp3">純音訊 MP3 (.mp3)</option>
                        <option value="wav">純音訊 WAV (.wav)</option>
                        <option value="aac">純音訊 AAC (.aac)</option>
                    </optgroup>
                </select>
            </div>

            <button id="videoBtn" onclick="convertVideos()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/25 transition-all text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                開始批量轉換影片
            </button>

            <!-- 進度條與狀態 -->
            <div id="progressContainer" class="hidden space-y-2 mt-4 bg-slate-950/40 p-4 rounded-xl border border-white/5">
                <div class="flex justify-between text-xs text-slate-300">
                    <span id="statusText" class="font-medium">狀態：準備中...</span>
                    <span id="timeRemaining" class="text-indigo-400">計算剩餘時間...</span>
                </div>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                    <div id="progressBar" class="bg-indigo-500 h-full w-0 transition-all duration-150"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === 標籤切換 ===
        function switchTab(type) {
            const isImg = type === 'image';
            document.getElementById('imageCard').classList.toggle('hidden', !isImg);
            document.getElementById('videoCard').classList.toggle('hidden', isImg);
            
            const imgBtn = document.getElementById('tabImgBtn');
            const vidBtn = document.getElementById('tabVidBtn');
            
            if (isImg) {
                imgBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-indigo-400 bg-indigo-500/15 shadow-sm";
                vidBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-400 hover:text-white";
            } else {
                vidBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-indigo-400 bg-indigo-500/15 shadow-sm";
                imgBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-400 hover:text-white";
            }
        }

        // === 拖曳上傳綁定 ===
        function setupDropZone(dropZoneId, inputId, listId) {
            const dz = document.getElementById(dropZoneId);
            const input = document.getElementById(inputId);
            const list = document.getElementById(listId);

            ['dragenter', 'dragover'].forEach(e => dz.addEventListener(e, (ev) => { ev.preventDefault(); dz.classList.add('dragover'); }));
            ['dragleave', 'drop'].forEach(e => dz.addEventListener(e, (ev) => { ev.preventDefault(); dz.classList.remove('dragover'); }));

            dz.addEventListener('drop', (ev) => {
                input.files = ev.dataTransfer.files;
                updateFileList(input, list);
            });
            input.addEventListener('change', () => updateFileList(input, list));
        }

        function updateFileList(input, listEl) {
            if (input.files.length > 0) {
                listEl.classList.remove('hidden');
                let html = `已選擇 ${input.files.length} 個檔案：<br>`;
                for (let f of input.files) html += `• ${f.name}<br>`;
                listEl.innerHTML = html;
            } else {
                listEl.classList.add('hidden');
                listEl.innerHTML = '';
            }
        }

        setupDropZone('imageDropZone', 'imageInput', 'imageList');
        setupDropZone('videoDropZone', 'videoInput', 'videoList');

        // === 圖片批量轉檔 (含 HEIC 支援) ===
        async function convertImages() {
            const input = document.getElementById('imageInput');
            const format = document.getElementById('imageTargetFormat').value;

            if (input.files.length === 0) {
                alert('請先選擇或拖入圖片！');
                return;
            }

            const ext = format.split('/')[1];

            for (let file of input.files) {
                let imgBlob = file;
                const isHeic = file.name.toLowerCase().endsWith('.heic') || file.name.toLowerCase().endsWith('.heif');

                if (isHeic) {
                    try {
                        imgBlob = await heic2any({ blob: file, toType: 'image/jpeg' });
                    } catch (err) {
                        console.error('HEIC 解碼失敗:', err);
                        continue;
                    }
                }

                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(imgBlob);
                    reader.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);

                            let dataUrl;
                            try {
                                dataUrl = canvas.toDataURL(format, 0.9);
                            } catch (err) {
                                dataUrl = canvas.toDataURL('image/png', 0.9);
                            }

                            const a = document.createElement('a');
                            a.href = dataUrl;
                            const nameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                            a.download = `${nameWithoutExt}_converted.${ext}`;
                            a.click();
                            resolve();
                        };
                    };
                });
            }

            // 轉檔完成後清空
            input.value = '';
            document.getElementById('imageList').classList.add('hidden');
            document.getElementById('imageList').innerHTML = '';
            alert('所有圖片轉檔並下載成功！');
        }

        // === 影片背景預載入與轉檔核心 ===
        const { createFFmpeg, fetchFile } = FFmpeg;
        let ffmpeg = null;
        let isFFmpegReady = false;

        async function initFFmpegBackground() {
            if (ffmpeg) return;
            try {
                ffmpeg = createFFmpeg({
                    corePath: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.6/dist/ffmpeg-core.js',
                    log: true
                });
                await ffmpeg.load();
                isFFmpegReady = true;
                console.log('FFmpeg 背景預載入完成！');
            } catch (err) {
                console.error('FFmpeg 載入失敗:', err);
            }
        }

        // 網頁一載入就默默在背景初始化
        window.addEventListener('DOMContentLoaded', () => {
            initFFmpegBackground();
        });

        async function convertVideos() {
            const input = document.getElementById('videoInput');
            const targetExt = document.getElementById('videoTargetExt').value;
            const btn = document.getElementById('videoBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');
            const timeRemaining = document.getElementById('timeRemaining');

            if (input.files.length === 0) {
                alert('請先選擇或拖入影片！');
                return;
            }

            btn.disabled = true;
            progressContainer.classList.remove('hidden');

            if (!isFFmpegReady) {
                statusText.innerText = '狀態：正在初始化影片核心...';
                await initFFmpegBackground();
            }

            try {
                const totalFiles = input.files.length;
                
                for (let i = 0; i < totalFiles; i++) {
                    const file = input.files[i];
                    const inputName = `input_${i}_${file.name}`;
                    const outputName = `output_${i}.${targetExt}`;

                    statusText.innerText = `正在處理 (${i + 1}/${totalFiles}): ${file.name}`;
                    
                    let startTime = Date.now();
                    let lastRatio = 0;

                    ffmpeg.setProgress(({ ratio }) => {
                        const percent = Math.max(0, Math.min(100, Math.round(ratio * 100)));
                        progressBar.style.width = `${percent}%`;

                        if (ratio > 0.05 && ratio < 1) {
                            let elapsed = (Date.now() - startTime) / 1000;
                            let estimatedTotal = elapsed / ratio;
                            let remaining = Math.max(0, Math.round(estimatedTotal - elapsed));
                            timeRemaining.innerText = `預計剩餘約 ${remaining} 秒`;
                        } else if (ratio >= 1) {
                            timeRemaining.innerText = `即將完成...`;
                        }
                    });

                    ffmpeg.FS('writeFile', inputName, await fetchFile(file));

                    if (targetExt === 'gif') {
                        await ffmpeg.run('-i', inputName, '-vf', 'fps=15,scale=480:-1:flags=lanczos', outputName);
                    } else {
                        await ffmpeg.run('-i', inputName, outputName);
                    }

                    const data = ffmpeg.FS('readFile', outputName);
                    const blob = new Blob([data.buffer]);
                    const url = URL.createObjectURL(blob);

                    const a = document.createElement('a');
                    a.href = url;
                    const nameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                    a.download = `${nameWithoutExt}_converted.${targetExt}`;
                    a.click();

                    // 清理虛擬檔案
                    ffmpeg.FS('unlink', inputName);
                    ffmpeg.FS('unlink', outputName);
                }

                statusText.innerText = '狀態：全部影片轉檔並下載成功！';
                timeRemaining.innerText = '完成';
                progressBar.style.width = '100%';

                // 轉檔成功後自動清空檔案與進度
                setTimeout(() => {
                    input.value = '';
                    document.getElementById('videoList').classList.add('hidden');
                    document.getElementById('videoList').innerHTML = '';
                    progressContainer.classList.add('hidden');
                    progressBar.style.width = '0%';
                }, 2000);

            } catch (err) {
                console.error(err);
                statusText.innerText = '狀態：轉檔過程發生錯誤，請檢查主控台。';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
