<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片、影片轉檔工具</title>
    <!-- HEIC 支援庫 -->
    <script src="https://unpkg.com/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <!-- FFmpeg v0.11.6 核心套件 -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 27, 45, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* 標籤頁 */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        /* 拖曳區域 */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 24px 16px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
        }

        .drop-zone icon {
            font-size: 32px;
            display: block;
            margin-bottom: 6px;
        }

        .drop-zone p {
            font-size: 13px;
            color: #e2e8f0;
            font-weight: 500;
        }

        .drop-zone span {
            font-size: 11px;
            color: var(--text-sub);
            display: block;
            margin-top: 2px;
        }

        .file-list {
            margin-top: 8px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            font-size: 12px;
            color: #cbd5e1;
            max-height: 100px;
            overflow-y: auto;
            display: none;
            line-height: 1.5;
        }

        select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .action-btn:hover {
            background: var(--primary-hover);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 進度條區域 */
        .progress-box {
            margin-top: 16px;
            padding: 14px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            transition: width 0.15s ease;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>⚡ 多媒體萬能轉檔工具</h1>
            <p>完全本地運作・隱私無虞・支援批量・極速轉檔</p>
        </div>

        <div class="tabs">
            <button id="tabImgBtn" class="tab-btn active" onclick="switchTab('image')">📷 圖片轉換 (含 HEIC)</button>
            <button id="tabVidBtn" class="tab-btn" onclick="switchTab('video')">🎬 影片 / 音訊轉換</button>
        </div>

        <!-- 圖片轉檔面板 -->
        <div id="imagePanel">
            <div class="form-group">
                <label>選擇或拖曳圖片 (可多選)</label>
                <div id="imageDropZone" class="drop-zone" onclick="document.getElementById('imageInput').click()">
                    <icon>📁</icon>
                    <p>點擊此處或將圖片拖曳到這裡</p>
                    <span>支援 JPG, PNG, WebP, AVIF, BMP, GIF, HEIC</span>
                    <input type="file" id="imageInput" accept="image/*,.heic,.heif" multiple class="hidden">
                </div>
                <div id="imageList" class="file-list"></div>
            </div>

            <div class="form-group">
                <label>目標輸出格式</label>
                <select id="imageFormat">
                    <option value="image/jpeg">JPG / JPEG (.jpg)</option>
                    <option value="image/png">PNG (.png)</option>
                    <option value="image/webp">WebP (.webp)</option>
                    <option value="image/avif">AVIF (.avif)</option>
                    <option value="image/bmp">BMP (.bmp)</option>
                    <option value="image/gif">GIF (.gif)</option>
                </select>
            </div>

            <button class="action-btn" onclick="convertImages()">開始批量轉換圖片</button>
        </div>

        <!-- 影片轉檔面板 -->
        <div id="videoPanel" class="hidden">
            <div class="form-group">
                <label>選擇或拖曳影片 / 音訊 (可多選)</label>
                <div id="videoDropZone" class="drop-zone" onclick="document.getElementById('videoInput').click()">
                    <icon>🎬</icon>
                    <p>點擊此處或將影片拖曳到這裡</p>
                    <span>支援 MP4, MKV, AVI, MOV, WebM, FLV 等</span>
                    <input type="file" id="videoInput" accept="video/*,audio/*" multiple class="hidden">
                </div>
                <div id="videoList" class="file-list"></div>
            </div>

            <div class="form-group">
                <label>目標輸出格式</label>
                <select id="videoFormat">
                    <optgroup label="主流影片格式">
                        <option value="mp4">MP4 (.mp4)</option>
                        <option value="webm">WebM (.webm)</option>
                        <option value="mkv">MKV (.mkv)</option>
                        <option value="avi">AVI (.avi)</option>
                        <option value="mov">MOV (.mov)</option>
                        <option value="flv">FLV (.flv)</option>
                        <option value="wmv">WMV (.wmv)</option>
                    </optgroup>
                    <optgroup label="特殊與純音訊">
                        <option value="gif">動態 GIF (.gif)</option>
                        <option value="mp3">純音訊 MP3 (.mp3)</option>
                        <option value="wav">純音訊 WAV (.wav)</option>
                        <option value="aac">純音訊 AAC (.aac)</option>
                    </optgroup>
                </select>
            </div>

            <button id="videoBtn" class="action-btn" onclick="convertVideos()">開始批量轉換影片</button>

            <div id="progressBox" class="progress-box">
                <div class="progress-info">
                    <span id="statusText" style="color: #e2e8f0;">準備中...</span>
                    <span id="timeText" style="color: #a5b4fc;">計算中...</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === 頁籤切換 ===
        function switchTab(type) {
            const isImg = type === 'image';
            document.getElementById('imagePanel').classList.toggle('hidden', !isImg);
            document.getElementById('videoPanel').classList.toggle('hidden', isImg);
            document.getElementById('tabImgBtn').classList.toggle('active', isImg);
            document.getElementById('tabVidBtn').classList.toggle('active', !isImg);
        }

        // === 拖曳檔案互動 ===
        function bindDropZone(zoneId, inputId, listId) {
            const zone = document.getElementById(zoneId);
            const input = document.getElementById(inputId);
            const list = document.getElementById(listId);

            ['dragenter', 'dragover'].forEach(e => zone.addEventListener(e, (ev) => { ev.preventDefault(); zone.classList.add('dragover'); }));
            ['dragleave', 'drop'].forEach(e => zone.addEventListener(e, (ev) => { ev.preventDefault(); zone.classList.remove('dragover'); }));

            zone.addEventListener('drop', (ev) => {
                input.files = ev.dataTransfer.files;
                renderFileList(input, list);
            });
            input.addEventListener('change', () => renderFileList(input, list));
        }

        function renderFileList(input, listEl) {
            if (input.files.length > 0) {
                listEl.style.display = 'block';
                let html = `<b>已選取 ${input.files.length} 個檔案：</b><br>`;
                for (let f of input.files) html += `• ${f.name}<br>`;
                listEl.innerHTML = html;
            } else {
                listEl.style.display = 'none';
                listEl.innerHTML = '';
            }
        }

        bindDropZone('imageDropZone', 'imageInput', 'imageList');
        bindDropZone('videoDropZone', 'videoInput', 'videoList');

        // === 圖片批量轉檔 (含 HEIC 讀取) ===
        async function convertImages() {
            const input = document.getElementById('imageInput');
            const format = document.getElementById('imageFormat').value;

            if (input.files.length === 0) {
                alert('請先選擇或拖曳圖片！');
                return;
            }

            const ext = format.split('/')[1];

            for (let file of input.files) {
                let imgBlob = file;
                const isHeic = file.name.toLowerCase().endsWith('.heic') || file.name.toLowerCase().endsWith('.heif');

                if (isHeic) {
                    try {
                        imgBlob = await heic2any({ blob: file, toType: 'image/jpeg' });
                    } catch (err) {
                        console.error('HEIC 解碼失敗:', err);
                        continue;
                    }
                }

                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(imgBlob);
                    reader.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);

                            let dataUrl;
                            try {
                                dataUrl = canvas.toDataURL(format, 0.9);
                            } catch (err) {
                                dataUrl = canvas.toDataURL('image/png', 0.9);
                            }

                            const a = document.createElement('a');
                            a.href = dataUrl;
                            const name = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                            a.download = `${name}_converted.${ext}`;
                            a.click();
                            resolve();
                        };
                    };
                });
            }

            // 清空列表
            input.value = '';
            renderFileList(input, document.getElementById('imageList'));
            alert('所有圖片轉檔並下載完成！');
        }

        // === FFmpeg v0.11.6 影音轉檔引擎 ===
        const { createFFmpeg, fetchFile } = FFmpeg;
        let ffmpeg = null;
        let isReady = false;

        async function initFFmpeg() {
            if (ffmpeg) return;
            try {
                ffmpeg = createFFmpeg({
                    corePath: 'https://unpkg.com/@ffmpeg/core@0.11.6/dist/ffmpeg-core.js',
                    log: true
                });
                await ffmpeg.load();
                isReady = true;
                console.log('FFmpeg 預載入成功！');
            } catch (err) {
                console.error('FFmpeg 初始化失敗:', err);
            }
        }

        // 網頁開檔即背景預載入
        window.addEventListener('DOMContentLoaded', () => {
            initFFmpeg();
        });

        async function convertVideos() {
            const input = document.getElementById('videoInput');
            const targetExt = document.getElementById('videoFormat').value;
            const btn = document.getElementById('videoBtn');
            const progressBox = document.getElementById('progressBox');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');
            const timeText = document.getElementById('timeText');

            if (input.files.length === 0) {
                alert('請先選擇或拖曳影片！');
                return;
            }

            btn.disabled = true;
            progressBox.style.display = 'block';

            if (!isReady) {
                statusText.innerText = '正在初始化引擎...';
                await initFFmpeg();
            }

            try {
                const total = input.files.length;

                for (let i = 0; i < total; i++) {
                    const file = input.files[i];
                    const inputName = `input_${i}_${file.name}`;
                    const outputName = `output_${i}.${targetExt}`;

                    statusText.innerText = `轉換中 (${i + 1}/${total}): ${file.name}`;
                    
                    let startTime = Date.now();

                    ffmpeg.setProgress(({ ratio }) => {
                        const pct = Math.max(0, Math.min(100, Math.round(ratio * 100)));
                        progressBar.style.width = `${pct}%`;

                        if (ratio > 0.05 && ratio < 1) {
                            let elapsed = (Date.now() - startTime) / 1000;
                            let totalSec = elapsed / ratio;
                            let remainSec = Math.max(0, Math.round(totalSec - elapsed));
                            timeText.innerText = `預計剩餘 ${remainSec} 秒`;
                        } else if (ratio >= 1) {
                            timeText.innerText = '準備下載...';
                        }
                    });

                    ffmpeg.FS('writeFile', inputName, await fetchFile(file));

                    if (targetExt === 'gif') {
                        await ffmpeg.run('-i', inputName, '-vf', 'fps=15,scale=480:-1:flags=lanczos', outputName);
                    } else {
                        await ffmpeg.run('-i', inputName, outputName);
                    }

                    const data = ffmpeg.FS('readFile', outputName);
                    const blob = new Blob([data.buffer]);
                    const url = URL.createObjectURL(blob);

                    const a = document.createElement('a');
                    a.href = url;
                    const name = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                    a.download = `${name}_converted.${targetExt}`;
                    a.click();

                    // 清理空間
                    ffmpeg.FS('unlink', inputName);
                    ffmpeg.FS('unlink', outputName);
                }

                statusText.innerText = '轉檔完畢！';
                timeText.innerText = '完成';
                progressBar.style.width = '100%';

                // 轉檔成功自動清空選單
                setTimeout(() => {
                    input.value = '';
                    renderFileList(input, document.getElementById('videoList'));
                    progressBox.style.display = 'none';
                    progressBar.style.width = '0%';
                }, 2000);

            } catch (err) {
                console.error(err);
                statusText.innerText = '轉檔失敗，請確認檔案格式';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
